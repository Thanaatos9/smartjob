<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Envoyer l'offre</title>
    <style>
      :root {
        /* Palette alignée sur la plateforme : blanc / vert / noir */
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #525252;
        --border: #e5e5e5;
        --primary: #16a34a;
        --primary-fg: #ffffff;
        --secondary: #f0fdf4;
        --secondary-fg: #15803d;
        --success: #16a34a;
        --danger: #dc2626;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      h1 { font-size: 14px; margin: 0; font-weight: 600; }
      .url {
        font-size: 12px;
        color: var(--muted);
        background: var(--secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 10px;
        word-break: break-all;
        max-height: 60px;
        overflow: auto;
      }
      input {
        font: inherit;
        font-size: 13px;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--fg);
        width: 100%;
      }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        border-radius: var(--radius);
        padding: 10px 12px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: opacity 0.15s, background 0.15s;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .primary { background: var(--primary); color: var(--primary-fg); }
      .primary:hover:not(:disabled) { opacity: 0.9; }
      .secondary { background: #fff; color: var(--fg); border-color: var(--border); }
      .secondary:hover:not(:disabled) { background: var(--secondary); }
      .success { background: var(--success); color: #fff; }
      .success:hover { opacity: 0.9; }
      .status { font-size: 12px; min-height: 16px; }
      .status.error { color: var(--danger); }
      .status.ok { color: var(--success); }
      .status.info { color: var(--muted); }
      .hidden { display: none; }
      .account {
        display: flex; align-items: center; justify-content: flex-end;
        font-size: 12px; color: var(--muted);
      }
      .link { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0; }
      .settings { display: flex; gap: 6px; align-items: center; }
      .settings input { flex: 1; font-size: 12px; padding: 6px 8px; }
      .gear {
        background: none; border: none; cursor: pointer; font-size: 13px;
        color: var(--muted); padding: 2px 4px; align-self: flex-end;
      }
      .row { display: flex; flex-direction: column; gap: 8px; }
      hr { border: none; border-top: 1px solid var(--border); margin: 2px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Envoyer cette offre</h1>

      <!-- Connexion (visible si pas de session) -->
      <div id="loginView" class="row hidden">
        <p class="status info">Connecte ton compte pour relier l'extension.</p>
        <input id="email" type="email" placeholder="Email" autocomplete="username" />
        <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
        <button id="loginBtn" class="primary">Se connecter</button>
      </div>

      <!-- Action principale (visible si connecté) -->
      <div id="mainView" class="row hidden">
        <div class="account">
          <button id="logoutBtn" class="link">Déconnexion</button>
        </div>
        <div id="url" class="url">…</div>
        <button id="send" class="primary">Envoyer le lien</button>
        <button id="open" class="success hidden">Voir l'offre →</button>
      </div>

      <div id="status" class="status info"></div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
